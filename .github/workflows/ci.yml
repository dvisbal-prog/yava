name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: yava_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de "packageManager" en package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Build admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
        run: pnpm --filter @yava/admin build
      - name: Validate SQL migrations + seed
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f scripts/pg_prelude.sql
          # Grants por defecto antes de las migraciones, como en Supabase
          psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f scripts/pg_grants.sql
          for f in supabase/migrations/*.sql; do
            # 0012 usa pg_cron y Vault, que solo existen en Supabase
            case "$f" in *0012_internal_jobs.sql) echo "omitida: $f"; continue;; esac
            psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f supabase/seed/seed.sql
          psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f scripts/pg_smoke.sql
          psql -h localhost -U postgres -d yava_test -v ON_ERROR_STOP=1 -f scripts/pg_smoke_0013.sql
